; Alembic 설정. 접속 주소는 alembic/env.py 가 backend/.env 에서 읽어 채우므로
; 여기에 비밀번호를 적지 않는다.
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
; 마이그레이션 파일 이름: 0003_add_xxx.py 처럼 번호가 앞에 오게 한다.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
