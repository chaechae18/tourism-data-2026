services:
  db:
    image: mysql:8.4
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-play_gyeongju}
      MYSQL_USER: ${MYSQL_USER:-play_gyeongju}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-dev-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/db/schema.mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # 컨테이너 안에서는 localhost 가 아니라 db 서비스로 접속
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-play_gyeongju}
      DB_USER: ${MYSQL_USER:-play_gyeongju}
      DB_PASSWORD: ${MYSQL_PASSWORD:-local-dev-password}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
  # TourAPI 주기 동기화. 목록의 modifiedtime 을 DB 와 대조해 바뀐 건만 상세를 받는다.
  # 마지막 성공 시각을 sync-state 에 남기므로, 다시 띄워도 주기를 새로 세지 않는다.
  sync:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-play_gyeongju}
      DB_USER: ${MYSQL_USER:-play_gyeongju}
      DB_PASSWORD: ${MYSQL_PASSWORD:-local-dev-password}
      # 실행 간격은 backend/.env 의 SYNC_INTERVAL_DAYS 로 조정한다 (기본 7일).
      SYNC_STATE_PATH: /app/state/last_sync.txt
    command: ["python", "sync_tourapi.py", "--loop"]
    restart: unless-stopped
    volumes:
      - sync-state:/app/state
    depends_on:
      # 스키마는 백엔드가 뜨면서 최신까지 올린다. MODIFIED_TIME 컬럼이 생긴 뒤에 붙어야 한다.
      backend:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8001}
      NEXT_TELEMETRY_DISABLED: 1
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
volumes:
  mysql-data:
  uploads-data:
  sync-state:
  frontend-node-modules:
  frontend-next-cache:
