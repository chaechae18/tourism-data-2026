services:
  db:
    profiles: ["local-db"]
    image: mysql:8.4
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-play_gyeongju}
      MYSQL_USER: ${MYSQL_USER:-play_gyeongju}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-dev-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/db/schema.mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: true
    environment:
      # DB 접속 정보와 CORS는 backend/.env를 사용한다. 스키마 변경은 별도 실행한다.
      DB_AUTO_MIGRATE: "false"
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - uploads-data:/app/uploads
      - ./backend/certs:/app/certs:ro
  # 운영 DB에 쓰는 동기화 작업은 --profile sync로 명시적으로 실행한다.
  sync:
    profiles: ["sync"]
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: true
    environment:
      # 실행 간격은 backend/.env 의 SYNC_INTERVAL_DAYS 로 조정한다 (기본 7일).
      SYNC_STATE_PATH: /app/state/last_sync.txt
    command: ["python", "sync_tourapi.py", "--loop"]
    restart: unless-stopped
    volumes:
      - sync-state:/app/state
      - ./backend/certs:/app/certs:ro
    depends_on:
      # 필요한 마이그레이션을 먼저 적용한 뒤 동기화를 시작한다.
      backend:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8001}
      NEXT_TELEMETRY_DISABLED: 1
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
volumes:
  mysql-data:
  uploads-data:
  sync-state:
  frontend-node-modules:
  frontend-next-cache:
